name: Deploy RoarNet Website

on:
  push:
    branches:
      - standalone-apk-integration
    paths:
      - docs/**
      - privacy.html
      - .github/workflows/deploy-privacy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: roarnet-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare complete website
        run: |
          test -s docs/index.html
          test -s docs/partner.html
          test -s privacy.html
          mkdir -p _site
          cp -a docs/. _site/
          cp privacy.html _site/privacy.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/partner.html
          test -s _site/privacy.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
