
plugins { id 'com.android.application' }

def roarnetLocalProperties = new Properties()
def roarnetLocalPropertiesFile = rootProject.file("local.properties")
if (roarnetLocalPropertiesFile.exists()) {
    roarnetLocalPropertiesFile.withInputStream {
        roarnetLocalProperties.load(it)
    }
}
def roarnetProxiesKey = roarnetLocalProperties.getProperty("PROXIES_FARMER_API_KEY", "")


android {
    buildFeatures { buildConfig true }

    namespace 'com.roarnet.app'
    compileSdk 35
    ndkVersion "29.0.14206865"
    defaultConfig {
        buildConfigField "String", "PROXIES_FARMER_API_KEY",
                "\"" + roarnetProxiesKey.replace("\\", "\\\\").replace('"', '\\"') + "\""

        applicationId 'com.roarnet.app'
        minSdk 24
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        targetSdk 28
        versionCode 2
        versionName '1.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
}


dependencies {
    implementation 'com.github.bolivian-peru:android-peer-sdk:v1.3.2'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
