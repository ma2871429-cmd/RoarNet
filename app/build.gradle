plugins { id 'com.android.application' }

android {
    namespace 'com.roarnet.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.roarnet.app'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
}


dependencies {
}
