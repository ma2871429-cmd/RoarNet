plugins { id 'com.android.application' }

android {
    namespace 'com.roarnet.app'
    compileSdk 35
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId 'com.roarnet.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        if (System.getenv("ROARNET_STORE_FILE")) {
            release {
                storeFile file(System.getenv("ROARNET_STORE_FILE"))
                storePassword System.getenv("ROARNET_STORE_PASSWORD")
                keyAlias System.getenv("ROARNET_KEY_ALIAS")
                keyPassword System.getenv("ROARNET_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("ROARNET_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
}
